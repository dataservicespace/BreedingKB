
name: Sync Feishu document and publish site

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

concurrency:
  group: feishu-sync-and-pages
  cancel-in-progress: false

jobs:
  # 第一阶段：同步飞书文档并构建网站
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install feishu2md
        run: |
          curl -fL --retry 3 \
            https://github.com/Wsine/feishu2md/releases/download/v2.4.5/feishu2md-v2.4.5-linux-amd64.tar.gz \
            -o /tmp/feishu2md.tar.gz

          mkdir -p /tmp/feishu2md
          tar -xzf /tmp/feishu2md.tar.gz -C /tmp/feishu2md

          BIN="$(find /tmp/feishu2md -type f -name feishu2md -print -quit)"
          test -n "$BIN"
          sudo install "$BIN" /usr/local/bin/feishu2md

          feishu2md --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install sync script dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Sync the single Feishu document
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: bash scripts/sync-feishu.sh

      - name: Commit generated documentation when changed
        run: |
          git config user.name "feishu-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/docs
          if git diff --cached --quiet; then
            echo "No document changes; skipping commit."
          else
            git commit -m "docs: sync from Feishu"
            git push
          fi

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.146.0"
          extended: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build website
        run: hugo --minify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: ./public

  # 第二阶段：等待 Artifact 就绪，再部署
  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      actions: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            artifact_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' \
              | head -n 1)"

            if [ -n "$artifact_id" ]; then
              echo "Found github-pages artifact: $artifact_id"
              exit 0
            fi

            echo "Waiting for artifact... (${attempt}/12)"
            sleep 5
          done

          echo "::error::github-pages artifact not found after 60 seconds"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
